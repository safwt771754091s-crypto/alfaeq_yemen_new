[functions.automation-worker]
verify_jwt = false
[functions.ai-event-worker]
verify_jwt = false

# Provider-agnostic online payments. The function authenticates the caller
# itself (and verifies the Stripe webhook HMAC), so JWT verification is off;
# this also keeps the Stripe webhook (which has no Supabase JWT) reachable.
[functions.payment-gateway]
verify_jwt = false

# Push fan-out is called by a database trigger (pg_net) with an HMAC signature
# instead of a Supabase JWT, so JWT verification is off; the function enforces
# the shared secret itself.
[functions.push-dispatch]
verify_jwt = false

[functions.sheets-catalog-sync]
verify_jwt = false

# Password recovery is emailed through Resend (the project has no built-in
# mailer). The function takes only an email and always returns a generic
# success, so it needs no JWT -- this also keeps it callable with the new
# non-JWT publishable keys.
[functions.request-password-reset]
verify_jwt = false
