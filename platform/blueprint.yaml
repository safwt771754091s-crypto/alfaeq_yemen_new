version: 1
name: alfaeq-build-platform
purpose: Production control plane for generating, testing, deploying, and operating applications, services, websites, and AI agents from one governed workflow.
source_of_truth:
  database: supabase-postgres
  auth: supabase-auth
  policy: supabase-rls
  realtime: supabase-realtime
  functions: supabase-edge-functions
control_plane:
  task_queue: ai_tasks
  agent_registry: ai_agents
  execution_runs: ai_agent_runs
  activity_log: ai_activity_log
  idempotency: required
  audit: required
execution:
  primary: github-actions
  agent_executor: openhands
  lightweight_agent: mini-swe-agent
  browser_agent: jev-ultrafast
  decision_router: jev
  specifications: spec-kit
  harness_policy: learn-harness-engineering
  sandbox: opensandbox
capabilities:
  application: [flutter, web, android]
  backend: [supabase, edge-functions, worker-services]
  website: [static-sites, dynamic-sites, website-import]
  intelligence: [ai-agents, decision-routing, browser-automation, web-research]
  data: [web-discovery, scraping, catalog-sync]
repository_adapters:
  - repo: safwt771754091s-crypto/Jev
    role: decision-engine
  - repo: safwt771754091s-crypto/jev-ultrafast
    role: browser-agent
  - repo: safwt771754091s-crypto/learn-harness-engineering
    role: agent-harness-patterns
  - repo: safwt771754091s-crypto/paperclip
    role: agent-work-management-patterns
  - repo: safwt771754091s-crypto/OpenHands
    role: engineering-executor
  - repo: safwt771754091s-crypto/OpenSandbox
    role: isolated-execution
  - repo: safwt771754091s-crypto/spec-kit
    role: specification-workflow
  - repo: safwt771754091s-crypto/Agent-Reach
    role: agent-web-access
  - repo: safwt771754091s-crypto/Scrapling
    role: web-extraction
  - repo: safwt771754091s-crypto/Website-downloader
    role: website-import
  - repo: safwt771754091s-crypto/mini-swe-agent
    role: lightweight-code-agent
safety:
  production_keys_never_enter_flutter: true
  production_keys_never_enter_browser_agent: true
  privileged_operations_server_side: true
  pull_request_before_main_merge: true
  verification_required: true
  reversible_external_side_effects: true
