# Aider project policy for Alfaeq Yemen.
# Secrets belong in the environment/secret manager, never in this file.

model: openai/gpt-5.6
editor-model: openai/gpt-5.6
weak-model: openai/gpt-5.6
architect: true
auto-accept-architect: false

map-refresh: auto
map-tokens: 12000
cache-prompts: true

auto-commits: true
show-diffs: true

# Keep production-critical verification explicit.
test-cmd: flutter test
lint-cmd: flutter analyze --no-fatal-infos --no-fatal-warnings

read:
  - CONVENTIONS.md
  - docs/database/README.md

# Never send generated/build artifacts to the model context.
aiderignore: .aiderignore
