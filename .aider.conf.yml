# Aider project policy for Alfaeq Yemen.
# Secrets belong in the environment/secret manager, never in this file.
# Keep model selection provider-native and update it only when the Aider
# model registry documents the newer model.

model: openai/gpt-5.4
editor-model: openai/gpt-5.4
weak-model: openai/gpt-5.4

architect: true
auto-accept-architect: false
map-refresh: auto
map-tokens: 12000
cache-prompts: true
auto-commits: true
show-diffs: true

test-cmd: flutter test
lint-cmd: flutter analyze --no-fatal-infos --no-fatal-warnings

read:
  - CONVENTIONS.md
  - docs/database/README.md

aiderignore: .aiderignore
