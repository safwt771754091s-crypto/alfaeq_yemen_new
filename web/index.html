<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="الفائق يمن — منصة رقمية متكاملة تبدأ من اليمن">
  <meta name="theme-color" content="#0B6E4F">
  <meta name="alfaeq-web-version" content="latest-2026-09-22">
  <title>الفائق يمن</title>
</head>
<body>
  <script>
    // Remove legacy Flutter service workers/caches so a newly deployed build
    // cannot be replaced by an older cached application shell.
    (async () => {
      if ('serviceWorker' in navigator) {
        try {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map((registration) => registration.unregister()));
        } catch (_) {}
      }
      if ('caches' in window) {
        try {
          const keys = await caches.keys();
          await Promise.all(keys.map((key) => caches.delete(key)));
        } catch (_) {}
      }
      const script = document.createElement('script');
      script.src = 'flutter_bootstrap.js?v=latest-2026-09-22';
      script.async = true;
      document.body.appendChild(script);
    })();
  </script>
</body>
</html>
