name: alfaeq_yemen
publish_to: "none"
version: 1.0.11+11

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.18.3
  google_sign_in: ^7.2.0
  geolocator: ^14.0.2
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  file_picker: ^13.1.0
  excel: ^4.0.6
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.3
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.0.0
  package_info_plus: ^10.2.2
  video_player: ^2.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/data/super_alfaeq/
  fonts:
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-Regular.ttf
