name: Alfaeq Yemen Android Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  android-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Create Android platform
        run: |
          flutter create . --platforms android --org com.alfaeq
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/app/src/main/AndroidManifest.xml')
          text = path.read_text()
          permissions = (
              '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n'
              '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n'
          )
          if 'android.permission.ACCESS_FINE_LOCATION' not in text:
              marker = '    <application'
              if marker not in text:
                  raise SystemExit('AndroidManifest.xml does not contain the expected application tag')
              text = text.replace(marker, permissions + marker, 1)
          path.write_text(text)
          PY
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          path = Path('android/app/src/main/AndroidManifest.xml')
          ET.parse(path)
          print(f'Valid AndroidManifest.xml: {path.stat().st_size} bytes')
          PY

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: python3 tools/configure_android_signing.py

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build APK
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          ALFAEQ_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALFAEQ_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ALFAEQ_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release --dart-define=SUPABASE_URL="https://esvljorjykzgrpnrxnma.supabase.co" --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"

      - name: Build AAB
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          ALFAEQ_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALFAEQ_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ALFAEQ_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build appbundle --release --dart-define=SUPABASE_URL="https://esvljorjykzgrpnrxnma.supabase.co" --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: alfaeq-yemen-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v7
        with:
          name: alfaeq-yemen-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      # نشر الإصدار على GitHub Releases ليصل الرابط الثابت
      # /releases/latest/download/app-release.apk إلى أحدث نسخة دائماً.
      - name: Read app version
        id: version
        run: |
          version="$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+)\+[0-9]+.*/\1/p' pubspec.yaml | head -1)"
          if [ -z "$version" ]; then
            echo "::error::Could not read version from pubspec.yaml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: الفائق يمن — الإصدار ${{ steps.version.outputs.version }}
          body: |
            تحديث جديد لتطبيق الفائق يمن (ويب + أندرويد).

            - رابط مشاركة وإعلان مع شعار الفائق يمن (تاجر / سائق / أصدقاء).
            - روابط جاهزة للنسخ والمشاركة عبر واتساب.

            > أُنشئ هذا الإصدار بواسطة وكيل ذكاء اصطناعي (OpenHands) نيابة عن المالك.
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          fail_on_unmatched_files: true
          make_latest: true
