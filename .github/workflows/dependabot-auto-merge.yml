name: Dependabot Auto-Merge

# Dependabot PRs get a read-only GITHUB_TOKEN on `pull_request`, so we use
# `pull_request_target` to obtain write access. This workflow never checks out
# or executes the pull request's code; it only queries check runs and merges.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write
  checks: read

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    # Explicit name so the wait loop can ignore this workflow's own check run.
    name: Dependabot auto-merge
    if: >
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Wait for all checks to pass
        id: wait
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          sha="$(gh pr view "$PR" --repo "$REPO" --json headRefOid -q .headRefOid)"
          echo "Watching checks for PR #$PR at $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          deadline=$(( $(date +%s) + 2400 ))
          while true; do
            runs="$(gh api "repos/$REPO/commits/$sha/check-runs?per_page=100")"
            # Keep only the newest check run per name and drop this workflow's own
            # checks (current and legacy job names); otherwise the loop waits on
            # itself and can never observe zero pending checks.
            others="$(jq -c '[.check_runs[]
              | select(.name != "Dependabot auto-merge" and .name != "auto-merge")
              | select(.status == "completed" or .status == "in_progress" or .status == "queued")]
              | group_by(.name) | map(max_by(.id))' <<<"$runs")"
            total="$(jq 'length' <<<"$others")"
            pending="$(jq '[.[] | select(.status != "completed")] | length' <<<"$others")"
            failed="$(jq '[.[] | select(.status == "completed" and (.conclusion != "success" and .conclusion != "skipped" and .conclusion != "neutral"))] | length' <<<"$others")"
            echo "total=$total pending=$pending failed=$failed"
            if [ "$failed" -gt 0 ]; then
              echo "::error::Checks failed for Dependabot PR #$PR; leaving it open."
              exit 1
            fi
            if [ "$total" -gt 0 ] && [ "$pending" -eq 0 ]; then
              echo "All checks passed."
              break
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::Timed out waiting for checks on Dependabot PR #$PR."
              exit 1
            fi
            sleep 30
          done

      - name: Confirm the verified commit is still the head
        id: confirm
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          VERIFIED_SHA: ${{ steps.wait.outputs.sha }}
        run: |
          set -euo pipefail
          # A `synchronize` push during the wait starts a fresh run for the new
          # head. Merging here would land code whose checks were never green, so
          # defer to that newer run instead of merging under stale checks.
          current="$(gh pr view "$PR" --repo "$REPO" --json headRefOid -q .headRefOid)"
          if [ "$current" = "$VERIFIED_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::PR #$PR head moved ($VERIFIED_SHA -> $current); deferring to the newer run."
          fi

      - name: Approve and merge
        if: steps.confirm.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh pr review --approve "$PR_URL" || true
          # Several Dependabot PRs often become green at once; the first merge
          # makes the others' base stale, so retry briefly before giving up.
          for attempt in 1 2 3 4 5; do
            if gh pr merge --squash --delete-branch "$PR_URL"; then
              echo "Merged on attempt $attempt."
              exit 0
            fi
            echo "Merge attempt $attempt blocked; refreshing state and retrying."
            sleep 20
          done
          echo "Direct merge blocked; enabling auto-merge instead."
          gh pr merge --squash --delete-branch --auto "$PR_URL"
