name: Build Fresh Alfaeq Yemen Android

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Verify source
        run: echo "FRESH BUILD SOURCE=$(git rev-parse HEAD)"
      - name: Create Android platform
        run: |
          flutter create . --platforms android --org com.alfaeq
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/app/src/main/AndroidManifest.xml')
          text = path.read_text()
          permissions = (
              '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n'
              '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n'
              '    <uses-permission android:name="android.permission.CAMERA" />\n'
              '    <uses-feature android:name="android.hardware.camera" android:required="false" />\n'
          )
          if 'android.permission.ACCESS_FINE_LOCATION' not in text:
              marker = '    <application'
              if marker not in text:
                  raise SystemExit('AndroidManifest.xml does not contain the expected application tag')
              text = text.replace(marker, permissions + marker, 1)
          path.write_text(text)
          PY
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          path = Path('android/app/src/main/AndroidManifest.xml')
          ET.parse(path)
          print(f'Valid AndroidManifest.xml: {path.stat().st_size} bytes')
          PY
          grep -q 'android.permission.ACCESS_FINE_LOCATION' android/app/src/main/AndroidManifest.xml
      - name: Dependencies
        run: flutter pub get
      - name: Security architecture tests
        run: flutter test test/security_architecture_test.dart
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Configure Gradle dependency cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Build APK (with dependency retry)
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        shell: bash
        run: |
          set -e
          for attempt in 1 2 3; do
            echo "Gradle/Flutter APK build attempt $attempt/3"
            if flutter build apk --debug --no-tree-shake-icons --dart-define=SUPABASE_URL="https://esvljorjykzgrpnrxnma.supabase.co" --dart-define=SUPABASE_PUBLISHABLE_KEY="${SUPABASE_PUBLISHABLE_KEY}"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              wait_seconds=$((attempt * 20))
              echo "Dependency/network failure detected; waiting ${wait_seconds}s before retry"
              sleep "$wait_seconds"
            fi
          done
          echo "APK build failed after 3 attempts"
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: alfaeq-yemen-fresh-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          overwrite: true
          retention-days: 7
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

