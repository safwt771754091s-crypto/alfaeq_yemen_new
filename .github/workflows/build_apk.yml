name: Build Flutter Android

on:
  workflow_dispatch:
  push:
    branches: ["main", "launch-prep-2026-09"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Ensure Android platform exists
        run: |
          if [ ! -d android ]; then
            flutter create . --platforms=android --org com.alfaeq
          fi

      - name: Set final Android application ID
        run: |
          test -f android/app/build.gradle.kts
          sed -i 's/applicationId = "[^"]*"/applicationId = "com.alfaeq.yemen"/' android/app/build.gradle.kts
          echo "Android applicationId set to com.alfaeq.yemen"
          grep -n "applicationId" android/app/build.gradle.kts

      - name: Generate Firebase options from google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > /tmp/google-services.json
            python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('/tmp/google-services.json').read_text())
          project = data['project_info']
          client = next(
              c for c in data['client']
              if c.get('client_info', {}).get('android_client_info', {}).get('package_name') == 'com.alfaeq.yemen'
          )
          options = {
              'apiKey': client['api_key'][0]['current_key'],
              'appId': client['client_info']['mobilesdk_app_id'],
              'messagingSenderId': project['project_number'],
              'projectId': project['project_id'],
              'storageBucket': project.get('storage_bucket'),
          }
          dart = """// Generated for the Alfaeq Yemen Android build from GOOGLE_SERVICES_JSON.\n// Do not edit this generated file manually.\nimport 'package:firebase_core/firebase_core.dart';\n\nclass DefaultFirebaseOptions {\n  const DefaultFirebaseOptions._();\n\n  static bool get isConfigured => true;\n\n  static FirebaseOptions get currentPlatform => android;\n\n  static const FirebaseOptions android = FirebaseOptions(\n    apiKey: %r,\n    appId: %r,\n    messagingSenderId: %r,\n    projectId: %r,\n    storageBucket: %r,\n  );\n}\n""" % (
              options['apiKey'], options['appId'], options['messagingSenderId'],
              options['projectId'], options['storageBucket']
          )
          Path('lib/core/firebase/firebase_options.dart').write_text(dart)
          print('Generated lib/core/firebase/firebase_options.dart for com.alfaeq.yemen')
          PY
          elif [ -n "$FIREBASE_OPTIONS_DART" ]; then
            printf '%s' "$FIREBASE_OPTIONS_DART" > lib/core/firebase/firebase_options.dart
            echo "Firebase options injected from FIREBASE_OPTIONS_DART."
          else
            echo "No Firebase secret configured; building with repository placeholder."
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build debug APK
        run: flutter build apk --debug --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: alfaeq-yemen-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
