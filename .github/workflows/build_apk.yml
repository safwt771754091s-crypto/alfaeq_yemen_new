name: Build Fresh Alfaeq Yemen Android

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Verify source
        run: echo "FRESH BUILD SOURCE=$(git rev-parse HEAD)"
      - name: Authenticate Google/Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Create Android platform
        run: flutter create . --platforms android --org com.alfaeq
      - name: Dependencies
        run: flutter pub get
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Install FlutterFire CLI
        run: |
          dart pub global activate flutterfire_cli
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
      - name: Generate Firebase configuration
        run: |
          flutterfire configure --project=alfaeq-yemen-fed37 --platforms=android,web --yes --out=lib/firebase_options.dart
          test -s lib/firebase_options.dart
          echo "Firebase configuration generated: $(wc -c < lib/firebase_options.dart) bytes"
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Build APK
        run: flutter build apk --debug --no-tree-shake-icons
      - uses: actions/upload-artifact@v4
        with:
          name: alfaeq-yemen-fresh-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          overwrite: true
          retention-days: 7
