name: Build Fresh Alfaeq Yemen Android

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Verify source
        run: echo "FRESH BUILD SOURCE=$(git rev-parse HEAD)"
      - name: Create Android platform
        run: flutter create . --platforms android --org com.alfaeq
      - name: Dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Build APK
        run: flutter build apk --debug --no-tree-shake-icons
      - uses: actions/upload-artifact@v4
        with:
          name: alfaeq-yemen-fresh-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          overwrite: true
          retention-days: 7
