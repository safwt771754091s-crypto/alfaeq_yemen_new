name: Apply Migrations

# Manual, opt-in helper to apply additive SQL migrations to the live database.
#
# Requires a repo secret SUPABASE_DB_URL (the Postgres connection string from
# Supabase -> Project Settings -> Database -> Connection string -> URI).
# It is never printed. This workflow only runs when dispatched by hand.
#
# Defaults to the two additive feature migrations shipped on 2026-10-25.
# Pass a space-separated `files` input to apply something else.

on:
  workflow_dispatch:
    inputs:
      files:
        description: 'Space-separated migration paths (relative to repo root)'
        required: true
        default: 'supabase/migrations/20261025010000_reels_v1.sql supabase/migrations/20261025020000_live_rooms_v1.sql'
      dry_run:
        description: 'Only check connectivity, do not apply'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    # Environment-scoped secrets are only visible to a job that names the
    # environment, so SUPABASE_DB_URL added under Settings -> Environments ->
    # Production was invisible and the guard always failed. Repo-level secrets
    # are still inherited; this only widens where the job looks.
    environment: Production
    steps:
      - uses: actions/checkout@v7

      - name: Guard — secret present
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL is empty for this job. Add it as a repository secret (Settings -> Secrets and variables -> Actions) or as an environment secret on 'Production'. Note this job runs in the Production environment, so a secret scoped to a different environment will not be visible."
            exit 1
          fi
          case "$DB_URL" in
            postgres://*|postgresql://*) ;;
            *) echo "::error::SUPABASE_DB_URL must start with postgres:// or postgresql://."; exit 1 ;;
          esac
          echo "SUPABASE_DB_URL is present."

      - name: Validate migration paths
        env:
          FILES: ${{ inputs.files }}
        run: |
          set -e
          for f in $FILES; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing file: $f"
              exit 1
            fi
            case "$f" in
              supabase/migrations/*.sql) ;;
              *) echo "::error::Refusing to apply outside supabase/migrations: $f"; exit 1 ;;
            esac
          done
          echo "Files to apply: $FILES"

      - name: Install psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Connectivity check
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -c "select version();"

      - name: Apply migrations
        if: ${{ inputs.dry_run == false }}
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          FILES: ${{ inputs.files }}
        run: |
          set -e
          for f in $FILES; do
            echo "::group::Applying $f"
            psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$f"
            echo "::endgroup::"
          done
          echo "All migrations applied."

      - name: Summary
        run: |
          {
            echo "### Apply Migrations"
            echo ""
            echo "- Files: \`${{ inputs.files }}\`"
            echo "- Dry run: \`${{ inputs.dry_run }}\`"
            echo "- Status: done"
          } >> "$GITHUB_STEP_SUMMARY"
