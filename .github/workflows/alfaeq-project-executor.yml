name: Alfaeq Project Executor

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Project task for the engineering agent"
        required: true
        type: string
      branch:
        description: "Branch to work from"
        required: false
        default: main
        type: string
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: alfaeq-project-executor-${{ github.event.issue.number || inputs.task || github.ref }}
  cancel-in-progress: false

jobs:
  execute:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'issues' && github.event.label.name == 'alfaeq-execute')
    runs-on: ubuntu-latest
    env:
      OPENHANDS_API_KEY: ${{ secrets.OPENHANDS_API_KEY }}
      OPENHANDS_BASE_URL: ${{ vars.OPENHANDS_BASE_URL || 'https://app.all-hands.dev' }}
    steps:
      - name: Verify executor configuration
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${OPENHANDS_API_KEY:-}" ]; then
            echo "::error::OPENHANDS_API_KEY is required."
            exit 1
          fi
          case "${OPENHANDS_BASE_URL}" in
            https://*) ;;
            *) echo "::error::OPENHANDS_BASE_URL must use HTTPS."; exit 1 ;;
          esac

      - name: Build bounded project brief
        id: brief
        shell: bash
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          MANUAL_TASK: ${{ inputs.task }}
          SELECTED_BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          task="${MANUAL_TASK:-}"
          if [ -z "$task" ] && [ -n "${ISSUE_TITLE:-}" ]; then
            task="${ISSUE_TITLE}"$'\n\n'"${ISSUE_BODY:-}"
          fi
          if [ -z "$task" ]; then
            echo "::error::No project task supplied."
            exit 1
          fi
          cat > project-task.md <<EOF
# Alfaeq Project Execution Task

Repository: ${GITHUB_REPOSITORY}
Base branch: ${SELECTED_BRANCH:-main}

## Task
$task

## Required execution contract
- Inspect the existing repository, migrations, RLS, RPCs, event bus and tests before editing.
- Supabase PostgreSQL is the production source of truth.
- Never request, print, commit, or store production service-role keys or other secrets.
- Work only in an isolated workspace and create a focused PR; never merge directly to main.
- Critical order, inventory, payment and ledger changes must be transactional and idempotent.
- Preserve prior state/compensation metadata for reversible external side effects.
- Use canonical Supabase events rather than creating a parallel business-state store.
- Use typed/structured browser automation when browser work is required; revalidate targets before mutation and independently verify outcomes.
- Run formatting, static analysis, tests, relevant builds and security checks.
- Treat security findings as confirmed, needs_validation, or rejected; do not promote an unresolved lead to a vulnerability.
- Do not claim completion without command/test evidence.
- If a required service or credential is unavailable, stop safely and report the exact blocker.
EOF
          echo "brief=project-task.md" >> "$GITHUB_OUTPUT"

      - name: Start OpenHands conversation
        id: openhands
        shell: bash
        env:
          BRANCH: ${{ inputs.branch || 'main' }}
        run: |
          set -euo pipefail
          prompt="$(cat "${{ steps.brief.outputs.brief }}")"
          payload="$(python - "$prompt" "${GITHUB_REPOSITORY}" "$BRANCH" <<'PY'
          import json,sys
          prompt,repo,branch=sys.argv[1:]
          print(json.dumps({
            "initial_message": {"role":"user","content":[{"type":"text","text":prompt}]},
            "selected_repository": repo,
            "selected_branch": branch,
          }))
          PY
          )"
          response="$(curl --fail-with-body --silent --show-error --retry 3 \
            -X POST "${OPENHANDS_BASE_URL%/}/api/v1/app-conversations" \
            -H "Authorization: Bearer ${OPENHANDS_API_KEY}" \
            -H "Content-Type: application/json" -H "Accept: application/json" \
            --data "$payload")"
          python - "$response" "${OPENHANDS_BASE_URL%/}" <<'PY'
          import json,sys,os,urllib.parse,urllib.request
          data=json.loads(sys.argv[1]); base=sys.argv[2]
          cid=data.get("app_conversation_id") or data.get("conversation_id")
          task_id=data.get("id") if not cid else None
          if not cid and task_id:
              url=f"{base}/api/v1/app-conversations/start-tasks?ids={urllib.parse.quote(str(task_id))}"
              req=urllib.request.Request(url,headers={"Authorization":"Bearer "+os.environ["OPENHANDS_API_KEY"],"Accept":"application/json"})
              with urllib.request.urlopen(req,timeout=60) as r: task_data=json.load(r)
              items=task_data.get("items") if isinstance(task_data,dict) else None
              if isinstance(items,list) and items: cid=items[0].get("app_conversation_id")
              elif isinstance(task_data,dict): cid=task_data.get("app_conversation_id")
          if not cid: raise SystemExit("OpenHands did not return an app_conversation_id")
          status=str(data.get("execution_status") or data.get("status") or "STARTING")
          print(f"conversation_id={cid}"); print(f"status={status}"); print(f"url={base}/conversations/{cid}")
          with open("openhands.json","w",encoding="utf-8") as f: json.dump({"id":cid,"status":status,"url":f"{base}/conversations/{cid}"},f)
          PY
          {
            echo "conversation-id=$(python -c 'import json;print(json.load(open("openhands.json"))["id"])')"
            echo "status=$(python -c 'import json;print(json.load(open("openhands.json"))["status"])')"
            echo "conversation-url=$(python -c 'import json;print(json.load(open("openhands.json"))["url"])')"
          } >> "$GITHUB_OUTPUT"

      - name: Poll OpenHands
        shell: bash
        env:
          CONVERSATION_ID: ${{ steps.openhands.outputs.conversation-id }}
        run: |
          set -euo pipefail
          deadline=$(($(date +%s) + 1800))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            response="$(curl --fail-with-body --silent --show-error --retry 3 \
              -H "Authorization: Bearer ${OPENHANDS_API_KEY}" -H "Accept: application/json" \
              "${OPENHANDS_BASE_URL%/}/api/v1/app-conversations?ids=${CONVERSATION_ID}")"
            status="$(python - "$response" <<'PY'
          import json,sys
          data=json.loads(sys.argv[1]); items=data.get("items") if isinstance(data,dict) else None
          item=items[0] if isinstance(items,list) and items else data
          print(str(item.get("execution_status") or item.get("status") or "UNKNOWN").upper())
          PY
            )"
            echo "OpenHands execution status: $status"
            case "$status" in
              STOPPED|FINISHED|COMPLETED|COMPLETED_SUCCESSFULLY|PAUSED) exit 0 ;;
              FAILED|ERROR|CANCELLED|RUNTIME_ERROR) echo "::error::OpenHands finished with status $status"; exit 1 ;;
            esac
            sleep 30
          done
          echo "::error::OpenHands execution timed out after 1800 seconds."
          exit 1

      - name: Record executor handoff artifact
        if: always()
        shell: bash
        env:
          CONVERSATION_ID: ${{ steps.openhands.outputs.conversation-id }}
          CONVERSATION_STATUS: ${{ steps.openhands.outputs.status }}
          CONVERSATION_URL: ${{ steps.openhands.outputs.conversation-url }}
        run: |
          set -euo pipefail
          mkdir -p execution-artifacts
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "commit=${GITHUB_SHA}"
            echo "task=${{ inputs.task }}"
            echo "conversation_id=${CONVERSATION_ID:-unknown}"
            echo "conversation_status=${CONVERSATION_STATUS:-unknown}"
            echo "conversation_url=${CONVERSATION_URL:-unknown}"
            echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > execution-artifacts/executor-handoff.txt

      - name: Upload executor handoff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alfaeq-project-executor-handoff
          path: execution-artifacts/executor-handoff.txt

      - name: Emit execution handoff
        if: success()
        shell: bash
        run: |
          echo "OpenHands completed its conversation."
          echo "A focused PR and GitHub Actions evidence are required before release."
