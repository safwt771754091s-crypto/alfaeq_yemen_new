name: Build Flutter APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
          
      - name: Update Gradle Settings Safely
        run: |
          GRADLE_FILE="android/app/build.gradle"
          if [ -f "$GRADLE_FILE" ]; then
            # التأكد من ضبط الـ minSdkVersion و targetSdkVersion بالشكل الصحيح
            sed -i 's/minSdkVersion.*/minSdkVersion 21/g' $GRADLE_FILE
            sed -i 's/targetSdkVersion.*/targetSdkVersion 34/g' $GRADLE_FILE
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Debug APK
        run: flutter build apk --debug
