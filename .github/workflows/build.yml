name: Build Flutter APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
          
      - name: Regenerate Android and Force MinSdk 21
        run: |
          # إعادة إنشاء مجلد الأندرويد لهيكل نظيف
          rm -rf android
          flutter create . --platforms=android --org com.alfaeq.yemen
          
          # تعديل minSdkVersion مباشرة داخل ملف build.gradle ليكون 21 صراحة
          GRADLE_FILE="android/app/build.gradle"
          if [ -f "$GRADLE_FILE" ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' $GRADLE_FILE
            sed -i 's/minSdkVersion\s\+.*/minSdkVersion 21/g' $GRADLE_FILE
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Debug APK
        run: flutter build apk --debug
