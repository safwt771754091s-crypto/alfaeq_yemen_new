name: Build Flutter APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          
      - name: Install Dependencies
        run: flutter pub get

      - name: Ensure Android Build Gradle Exists and Configure SDKs
        run: |
          GRADLE_PATH="android/app/build.gradle"
          if [ -f "$GRADLE_PATH" ]; then
            echo "Configuring existing build.gradle..."
            # التأكد من عدم وجود قيم فارغة وتحديثها بقيم صريحة
            sed -i 's/compileSdkVersion.*/compileSdkVersion 35/g' $GRADLE_PATH
            sed -i 's/compileSdk =.*/compileSdk = 35/g' $GRADLE_PATH
            sed -i 's/targetSdkVersion.*/targetSdkVersion 35/g' $GRADLE_PATH
            sed -i 's/targetSdk =.*/targetSdk = 35/g' $GRADLE_PATH
            sed -i 's/minSdkVersion.*/minSdkVersion 21/g' $GRADLE_PATH
            sed -i 's/minSdk =.*/minSdk = 21/g' $GRADLE_PATH
          else
            echo "Creating android platform files..."
            flutter create . --platforms=android --org com.alfaeq.yemen
          fi

      - name: Build Debug APK
        run: flutter build apk --debug
