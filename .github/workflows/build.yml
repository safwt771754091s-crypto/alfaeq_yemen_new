name: Build Flutter APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          
      - name: Install Dependencies
        run: flutter pub get

      - name: Clean and Fix Android SDK Configuration
        run: |
          # إزالة السطور الخاطئة من gradle.properties إن وجدت
          rm -f android/gradle.properties
          flutter create . --platforms=android --org com.alfaeq.yemen
          
          GRADLE_FILE="android/app/build.gradle"
          if [ -f "$GRADLE_FILE" ]; then
            # استبدال القيم بطريقة آمنة وصريحة
            sed -i 's/minSdkVersion.*/minSdkVersion flutter.minSdkVersion/g' $GRADLE_FILE
            sed -i 's/targetSdkVersion.*/targetSdkVersion 35/g' $GRADLE_FILE
            sed -i 's/compileSdkVersion.*/compileSdkVersion 35/g' $GRADLE_FILE
            
            # إضافة القيم بشكل مباشر كأرقام صحيحة داخل ملف الـ gradle إن لم تتغير
            echo "flutter.minSdkVersion=21" >> android/gradle.properties
          fi

      - name: Build Debug APK
        run: flutter build apk --debug
