name: Build Flutter APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
          
      - name: Fix MinSdk for Plugins Compatibility
        run: |
          # تحديث ملف build.gradle الخاص بالـ app لرفع الـ minSdkVersion تلقائياً إلى القيمة المتوافقة (21 أو أعلى حسب الحاجة)
          GRADLE_FILE="android/app/build.gradle"
          if [ -f "$GRADLE_FILE" ]; then
            sed -i 's/minSdkVersion.*/minSdkVersion flutter.minSdkVersion/g' $GRADLE_FILE
          fi
          
          # ضبط الـ flutter.minSdkVersion في local.properties ليكون 21 كحد أدنى آمن
          echo "flutter.minSdkVersion=21" >> android/local.properties

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Debug APK
        run: flutter build apk --debug
