name: Build Flutter APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
          
      - name: Force Clean and Generate Android Embedding v2
        run: |
          # حذف مجلد الأندرويد القديم بالكامل الذي يسبب المشكلة
          rm -rf android
          
          # إنشاء هيكل أندرويد جديد كلياً يدعم Embedding v2 الحديث وباسم الحزمة الصحيح
          flutter create . --platforms=android --org com.alfaeq.yemen
          
          # تعديل ملف build.gradle لضبط الإصدارات
          GRADLE_FILE="android/app/build.gradle"
          if [ -f "$GRADLE_FILE" ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' $GRADLE_FILE
            sed -i 's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 34/g' $GRADLE_FILE
            sed -i 's/compileSdkVersion.*/compileSdkVersion 34/g' $GRADLE_FILE
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Debug APK
        run: flutter build apk --debug
