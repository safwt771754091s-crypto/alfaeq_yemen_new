name: Build Flutter APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          
      - name: Install Dependencies
        run: flutter pub get

      - name: Regenerate Android and Set SDK Versions
        run: |
          rm -rf android
          flutter create . --platforms=android --org com.alfaeq.yemen
          
          GRADLE_FILE="android/app/build.gradle"
          if [ -f "$GRADLE_FILE" ]; then
            echo "Updating minSdk to 21 and compileSdk to 35..."
            sed -i 's/minSdkVersion [0-9]*/minSdkVersion 21/g' $GRADLE_FILE
            sed -i 's/minSdk = [0-9]*/minSdk = 21/g' $GRADLE_FILE
            sed -i 's/compileSdkVersion [0-9]*/compileSdkVersion 35/g' $GRADLE_FILE
            sed -i 's/compileSdk = [0-9]*/compileSdk = 35/g' $GRADLE_FILE
            sed -i 's/targetSdkVersion [0-9]*/targetSdkVersion 35/g' $GRADLE_FILE
            sed -i 's/targetSdk = [0-9]*/targetSdk = 35/g' $GRADLE_FILE
          fi

      - name: Build Debug APK
        run: flutter build apk --debug
