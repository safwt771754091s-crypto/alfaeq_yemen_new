name: Build Flutter APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          
      - name: Install Dependencies
        run: flutter pub get

      - name: Create Android files if missing
        run: flutter create . --platforms=android --org com.alfaeq.yemen

      - name: Force Fix Compile SDK to 35
        run: |
          FILE="android/app/build.gradle"
          if [ -f "$FILE" ]; then
            echo "Editing $FILE..."
            sed -i 's/compileSdkVersion [0-9]*/compileSdkVersion 35/g' $FILE
            sed -i 's/compileSdk = [0-9]*/compileSdk = 35/g' $FILE
            sed -i 's/targetSdkVersion [0-9]*/targetSdkVersion 35/g' $FILE
            sed -i 's/targetSdk = [0-9]*/targetSdk = 35/g' $FILE
            echo "Successfully updated compileSdk to 35"
          else
            echo "File not found!"
          fi
        
      - name: Build Debug APK
        run: flutter build apk --debug
