name: Build Flutter APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
          
      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK Release/Debug with Gradle Wrapper Fix
        run: |
          # بناء التطبيق مباشرة مع السماح لـ Flutter بإنشاء ملفات Gradle المتوافقة تلقائياً
          flutter build apk --debug --verbose
