name: Build Flutter APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
          
      - name: Migrate to Android Embedding V2 Cleanly
        run: |
          # حذف مجلد الأندرويد القديم الذي يسبب المشاكل
          rm -rf android
          
          # إنشاء هيكل أندرويد جديد بالكامل يدعم Embedding V2 تلقائياً
          flutter create . --platforms=android --org com.alfaeq.yemen
          
          # ضبط minSdkVersion إلى 21 لضمان توافق الحزم الحديثة
          mkdir -p android/app
          echo "flutter.minSdkVersion=21" > android/local.properties

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Debug APK
        run: flutter build apk --debug
