name: Catalog → Google Sheets (with images)

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Max products to export this run (0 = all)"
        required: false
        default: "0"
      providers:
        description: "Image providers: off,google,openverse"
        required: false
        default: "off,google"
      tab:
        description: "Sheet tab name"
        required: false
        default: "Products"
      create:
        description: "true = create a NEW spreadsheet (ignores spreadsheet id)"
        required: false
        default: "true"
      title:
        description: "Title for a newly created spreadsheet"
        required: false
        default: "Alfaeq Yemen — Catalog"
      share_with:
        description: "Google account email to share the sheet with (Editor)"
        required: false
        default: ""
      dry_run:
        description: "true = build rows only, do not write the sheet"
        required: false
        default: "false"

concurrency:
  group: catalog-sheets-export
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Guard — Google service account must be present
        env:
          SA: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$SA" ]; then
            echo "::error::Add repository secret GOOGLE_SERVICE_ACCOUNT_JSON (a Google service-account key with Sheets + Drive access)."
            exit 1
          fi
          if [ "${{ inputs.create }}" != "true" ] && [ -z "${{ secrets.GOOGLE_SHEETS_DOCUMENT_ID }}" ]; then
            echo "::error::Either set create=true (new sheet) or add secret GOOGLE_SHEETS_DOCUMENT_ID (existing sheet id)."
            exit 1
          fi

      - name: Export products with images to Google Sheets
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEETS_DOCUMENT_ID: ${{ secrets.GOOGLE_SHEETS_DOCUMENT_ID }}
          GOOGLE_SHEETS_TAB: ${{ inputs.tab || 'Products' }}
          GOOGLE_SHEETS_TITLE: ${{ inputs.title || 'Alfaeq Yemen — Catalog' }}
          GOOGLE_SHEETS_SHARE_WITH: ${{ inputs.share_with }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_CSE_CX: ${{ secrets.GOOGLE_CSE_CX }}
        run: |
          python3 tools/export_catalog_to_sheets.py \
            --limit "${{ inputs.limit || '0' }}" \
            --providers "${{ inputs.providers || 'off,google' }}" \
            --tab "${{ inputs.tab || 'Products' }}" \
            --title "${{ inputs.title || 'Alfaeq Yemen — Catalog' }}" \
            ${{ inputs.share_with != '' && format('--share-with "{0}"', inputs.share_with) || '' }} \
            ${{ inputs.create == 'true' && '--create' || '' }} \
            ${{ inputs.dry_run == 'true' && '--dry-run' || '' }}
