name: Deploy Alfaeq Yemen Web Portal

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alfaeq-yemen-web-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Configure Firebase Web App
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_TOKEN" || {
            echo 'Missing FIREBASE_TOKEN GitHub Actions secret.'
            echo 'Add it privately in Settings > Secrets and variables > Actions.'
            exit 1
          }

          firebase apps:list --project alfaeq-yemen-fed37 --token "$FIREBASE_TOKEN" --json > /tmp/firebase_apps.json

          WEB_APP_ID=$(python3 - <<'PY'
          import json
          with open('/tmp/firebase_apps.json', encoding='utf-8') as f:
              data = json.load(f)
          apps = data.get('result', {}).get('apps', [])
          web = next((a for a in apps if str(a.get('platform', '')).upper() == 'WEB'), None)
          if not web:
              raise SystemExit('No Firebase Web App is registered in project alfaeq-yemen-fed37. Register one in Firebase Console first.')
          app_id = web.get('appId') or web.get('app_id')
          if not app_id:
              raise SystemExit('Firebase Web App was found but its appId is missing.')
          print(app_id)
          PY
          )

          firebase apps:sdkconfig WEB "$WEB_APP_ID" \
            --project alfaeq-yemen-fed37 \
            --token "$FIREBASE_TOKEN" \
            --json > /tmp/firebase_web_config.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          raw = json.loads(Path('/tmp/firebase_web_config.json').read_text(encoding='utf-8'))
          cfg = raw.get('result', raw)
          if isinstance(cfg, dict) and isinstance(cfg.get('config'), dict):
              cfg = cfg['config']
          if not isinstance(cfg, dict):
              raise SystemExit('Firebase CLI returned an unexpected Web configuration format.')

          required = ['apiKey', 'appId', 'messagingSenderId', 'projectId']
          missing = [key for key in required if not cfg.get(key)]
          if missing:
              raise SystemExit('Firebase Web configuration is missing: ' + ', '.join(missing))

          def dart_string(value):
              return str(value).replace('\\', '\\\\').replace("'", "\\'")

          lines = [
              '// Generated by CI from the registered Firebase Web App.',
              '// Do not commit credentials or replace this with placeholder values.',
              '',
              "import 'package:firebase_core/firebase_core.dart';",
              '',
              'class DefaultFirebaseOptions {',
              '  const DefaultFirebaseOptions._();',
              '',
              '  static FirebaseOptions get currentPlatform => web;',
              '',
              '  static const FirebaseOptions web = FirebaseOptions(',
              f"    apiKey: '{dart_string(cfg['apiKey'])}',",
              f"    appId: '{dart_string(cfg['appId'])}',",
              f"    messagingSenderId: '{dart_string(cfg['messagingSenderId'])}',",
              f"    projectId: '{dart_string(cfg['projectId'])}',",
          ]

          for key in ('authDomain', 'storageBucket', 'measurementId'):
              if cfg.get(key):
                  lines.append(f"    {key}: '{dart_string(cfg[key])}',")

          lines += ['  );', '', '  static bool get isConfigured => true;', '}', '']
          Path('lib/core/firebase/firebase_options.dart').write_text('\n'.join(lines), encoding='utf-8')
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build Web release
        run: flutter build web --release

      - name: Deploy Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          set -euo pipefail
          firebase deploy --only hosting --project alfaeq-yemen-fed37 --token "$FIREBASE_TOKEN"
