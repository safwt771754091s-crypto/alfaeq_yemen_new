name: Deploy Fresh Alfaeq Yemen Web

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

env:
  RECAPTCHA_V3_SITE_KEY: 6LcDsK8tAAAAAIao34qFSlPGecpCxGolh_GpzUol

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Ensure Web platform
        run: |
          if [ ! -d web ]; then
            echo "Web platform is missing; generating it now."
            flutter create . --platforms=web
          else
            echo "Web platform already exists; keeping repository files unchanged."
          fi
          test -f web/index.html
      - name: Authenticate Google/Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Dependencies
        run: flutter pub get
      - name: Security architecture tests
        run: flutter test test/security_architecture_test.dart
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Install FlutterFire CLI
        run: |
          dart pub global activate flutterfire_cli
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
      - name: Generate Firebase configuration
        run: |
          flutterfire configure --project=alfaeq-yemen-fed37 --platforms=web --yes --out=lib/firebase_options.dart
          test -s lib/firebase_options.dart
          echo "Firebase configuration generated: $(wc -c < lib/firebase_options.dart) bytes"
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Build Web
        run: |
          rm -rf build/web
          flutter build web --release --pwa-strategy=none --dart-define=RECAPTCHA_V3_SITE_KEY="$RECAPTCHA_V3_SITE_KEY"
          rm -f build/web/flutter_service_worker.js
      - name: Verify fresh web build
        run: |
          test -s build/web/index.html
          test -s build/web/main.dart.js
          test -s build/web/flutter_bootstrap.js
          test ! -e build/web/flutter_service_worker.js
          echo "Fresh web build verified: $(du -sh build/web | cut -f1)"
      - name: Deploy Hosting and Firestore rules
        run: firebase deploy --only hosting,firestore --project alfaeq-yemen-fed37
