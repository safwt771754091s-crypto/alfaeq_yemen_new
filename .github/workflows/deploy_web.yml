name: Deploy Alfaeq Yemen Web Portal

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Configure Firebase web app
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
        run: |
          set -e
          if [ -n "$FIREBASE_OPTIONS_DART" ]; then
            printf '%s' "$FIREBASE_OPTIONS_DART" > lib/core/firebase/firebase_options.dart
            echo 'Using FIREBASE_OPTIONS_DART secret.'
            exit 0
          fi

          test -n "$FIREBASE_TOKEN" || { echo 'Missing FIREBASE_TOKEN; cannot obtain Firebase web configuration or deploy Hosting.'; exit 1; }

          echo 'FIREBASE_OPTIONS_DART is not set; obtaining the registered Firebase Web App configuration via Firebase CLI.'
          firebase apps:list --project alfaeq-yemen-fed37 --token "$FIREBASE_TOKEN" --json > /tmp/firebase_apps.json

          WEB_APP_ID=$(python3 - <<'PY'
          import json
          with open('/tmp/firebase_apps.json', encoding='utf-8') as f:
              data = json.load(f)
          apps = data.get('result', {}).get('apps', [])
          web = next((a for a in apps if str(a.get('platform', '')).upper() == 'WEB'), None)
          if not web:
              raise SystemExit('No Firebase Web App is registered in project alfaeq-yemen-fed37. Register a Web app in Firebase first.')
          app_id = web.get('appId') or web.get('app_id')
          if not app_id:
              raise SystemExit('Firebase Web App was found but its appId is missing.')
          print(app_id)
          PY
          )

          echo "Found Firebase Web App: $WEB_APP_ID"
          firebase apps:sdkconfig WEB "$WEB_APP_ID" --project alfaeq-yemen-fed37 --token "$FIREBASE_TOKEN" --json > /tmp/firebase_web_config.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          raw = json.loads(Path('/tmp/firebase_web_config.json').read_text(encoding='utf-8'))
          cfg = raw.get('result', raw)
          if isinstance(cfg, dict) and 'config' in cfg and isinstance(cfg['config'], dict):
              cfg = cfg['config']
          if not isinstance(cfg, dict):
              raise SystemExit('Firebase CLI returned an unexpected Web App configuration format.')

          required = ['apiKey', 'appId', 'messagingSenderId', 'projectId']
          missing = [k for k in required if not cfg.get(k)]
          if missing:
              raise SystemExit('Firebase Web configuration is missing: ' + ', '.join(missing))

          def dart(v):
              return v.replace('\\', '\\\\').replace("'", "\\'")

          lines = [
              "// Generated by CI from the registered Firebase Web App configuration.",
              "// Do not replace with placeholder values.",
              "",
              "import 'package:firebase_core/firebase_core.dart';",
              "",
              "class DefaultFirebaseOptions {",
              "  const DefaultFirebaseOptions._();",
              "",
              "  static FirebaseOptions get currentPlatform => web;",
              "",
              "  static const FirebaseOptions web = FirebaseOptions(",
              f"    apiKey: '{dart(cfg['apiKey'])}',",
              f"    appId: '{dart(cfg['appId'])}',",
              f"    messagingSenderId: '{dart(cfg['messagingSenderId'])}',",
              f"    projectId: '{dart(cfg['projectId'])}',",
          ]
          for key in ('authDomain', 'storageBucket', 'measurementId'):
              if cfg.get(key):
                  lines.append(f"    {key}: '{dart(cfg[key])}',")
          lines += [
              "  );",
              "",
              "  static bool get isConfigured => true;",
              "}",
              "",
          ]
          Path('lib/core/firebase/firebase_options.dart').write_text('\n'.join(lines), encoding='utf-8')
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Build web
        run: flutter build web --release

      - name: Deploy Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          test -n "$FIREBASE_TOKEN" || { echo 'Missing FIREBASE_TOKEN secret; Firebase Hosting deployment cannot continue.'; exit 1; }
          firebase deploy --only hosting --project alfaeq-yemen-fed37 --token "$FIREBASE_TOKEN"
