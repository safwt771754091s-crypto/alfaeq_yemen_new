name: Deploy Fresh Alfaeq Yemen Web

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Authenticate Google/Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Create Web platform
        run: flutter create . --platforms web
      - name: Dependencies
        run: flutter pub get
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Install FlutterFire CLI
        run: |
          dart pub global activate flutterfire_cli
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
      - name: Generate Firebase configuration
        run: |
          flutterfire configure --project=alfaeq-yemen-fed37 --platforms=web --yes --out=lib/firebase_options.dart
          test -s lib/firebase_options.dart
          echo "Firebase configuration generated: $(wc -c < lib/firebase_options.dart) bytes"
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Build Web
        run: flutter build web --release
      - name: Deploy Hosting and Firestore rules
        run: firebase deploy --only hosting,firestore --project alfaeq-yemen-fed37
