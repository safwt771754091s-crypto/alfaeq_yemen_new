name: Deploy Alfaeq Yemen Web Portal

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alfaeq-yemen-web-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Authenticate Google Cloud with Firebase service account
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Firebase CLI
        run: npm install -g firebase-tools

      - name: Configure Firebase Web App
        run: |
          set -euo pipefail

          firebase apps:list --project alfaeq-yemen-fed37 --json > /tmp/firebase_apps.json

          WEB_APP_ID=$(python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('/tmp/firebase_apps.json').read_text(encoding='utf-8'))
          result = data.get('result', data) if isinstance(data, dict) else data

          if isinstance(result, list):
              apps = result
          elif isinstance(result, dict):
              apps = result.get('apps', [])
          else:
              apps = []

          if not isinstance(apps, list):
              raise SystemExit('Firebase CLI returned an unexpected apps:list JSON format.')

          web = next(
              (a for a in apps if isinstance(a, dict) and str(a.get('platform', '')).upper() == 'WEB'),
              None,
          )
          if not web:
              raise SystemExit(
                  'No Firebase Web App is registered in project alfaeq-yemen-fed37. '
                  'Register one in Firebase Console first.'
              )

          app_id = web.get('appId') or web.get('app_id')
          if not app_id:
              raise SystemExit('Firebase Web App was found but its appId is missing.')
          print(app_id)
          PY
          )

          firebase apps:sdkconfig WEB "$WEB_APP_ID" \
            --project alfaeq-yemen-fed37 \
            --json > /tmp/firebase_web_config.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          raw = json.loads(Path('/tmp/firebase_web_config.json').read_text(encoding='utf-8'))
          required = ('apiKey', 'appId', 'messagingSenderId', 'projectId')

          def find_config(value):
              if isinstance(value, dict):
                  if all(value.get(key) for key in required):
                      return value
                  for child in value.values():
                      found = find_config(child)
                      if found:
                          return found
              elif isinstance(value, list):
                  for child in value:
                      found = find_config(child)
                      if found:
                          return found
              return None

          cfg = find_config(raw)
          if not cfg:
              raise SystemExit(
                  'Firebase Web configuration was returned, but the required fields '
                  'apiKey, appId, messagingSenderId, projectId could not be located.'
              )

          def dart_string(value):
              return str(value).replace('\\', '\\\\').replace("'", "\\'")

          lines = [
              '// Generated by CI from the registered Firebase Web App.',
              '// Do not commit credentials or replace this with placeholder values.',
              '',
              "import 'package:firebase_core/firebase_core.dart';",
              '',
              'class DefaultFirebaseOptions {',
              '  const DefaultFirebaseOptions._();',
              '',
              '  static FirebaseOptions get currentPlatform => web;',
              '',
              '  static const FirebaseOptions web = FirebaseOptions(',
              f"    apiKey: '{dart_string(cfg['apiKey'])}',",
              f"    appId: '{dart_string(cfg['appId'])}',",
              f"    messagingSenderId: '{dart_string(cfg['messagingSenderId'])}',",
              f"    projectId: '{dart_string(cfg['projectId'])}',",
          ]

          for key in ('authDomain', 'storageBucket', 'measurementId'):
              if cfg.get(key):
                  lines.append(f"    {key}: '{dart_string(cfg[key])}',")

          lines += ['  );', '', '  static bool get isConfigured => true;', '}', '']
          Path('lib/core/firebase/firebase_options.dart').write_text('\n'.join(lines), encoding='utf-8')
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build Web release
        run: flutter build web --release

      - name: Deploy Firebase Hosting
        run: |
          set -euo pipefail
          firebase deploy --only hosting --project alfaeq-yemen-fed37
