name: Flutter Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - supabase-migration-foundation
      - fix-web-platform-core
      - fix/stage4-cart-catalog-link
      - feat/harness-engineering
  pull_request:
    branches:
      - main

concurrency:
  group: flutter-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build web
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          RECAPTCHA_ENTERPRISE_SITE_KEY: ${{ secrets.RECAPTCHA_ENTERPRISE_SITE_KEY }}
        run: |
          flutter build web --release --pwa-strategy=none --base-href /alfaeq_yemen_new/ --dart-define=SUPABASE_URL="https://esvljorjykzgrpnrxnma.supabase.co" --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" --dart-define=RECAPTCHA_ENTERPRISE_SITE_KEY="$RECAPTCHA_ENTERPRISE_SITE_KEY"
          rm -f build/web/flutter_service_worker.js
      - uses: actions/upload-artifact@v4
        with:
          name: alfaeq-yemen-web
          path: build/web

  deploy-web:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-web
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Download web artifact
        uses: actions/download-artifact@v4
        with:
          name: alfaeq-yemen-web
          path: build/web
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  web-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy-web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Smoke test published Flutter app
        env:
          APP_URL: ${{ needs.deploy-web.outputs.page_url }}
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const url = process.env.APP_URL;
          if (!url) throw new Error('GitHub Pages did not return a deployment URL');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({ viewport: { width: 390, height: 844 } });
            const errors = [];
            page.on('pageerror', e => errors.push(String(e)));
            page.on('console', m => { if (m.type() === 'error') errors.push(m.text()); });
            await page.goto(url, { waitUntil: 'networkidle', timeout: 60000 });
            await page.waitForTimeout(5000);
            const state = await page.evaluate(() => ({
              title: document.title,
              glass: !!document.querySelector('flt-glass-pane'),
              canvas: !!document.querySelector('canvas'),
              bodyText: document.body.innerText || ''
            }));
            console.log(JSON.stringify({url, state, errors}, null, 2));
            if (!state.glass && !state.canvas) throw new Error('Flutter engine did not start: published page is effectively blank');
            if (errors.length) throw new Error('Browser console/page errors detected: ' + errors.join(' | '));
            await browser.close();
          })();
          NODE

  build-android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Android platform
        run: |
          flutter create . --platforms android --org com.alfaeq
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          path = Path('android/app/src/main/AndroidManifest.xml')
          text = path.read_text()
          permissions = (
              '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n'
              '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n'
          )
          if 'android.permission.ACCESS_FINE_LOCATION' not in text:
              marker = '    <application'
              if marker not in text:
                  raise SystemExit('AndroidManifest.xml does not contain the expected application tag')
              text = text.replace(marker, permissions + marker, 1)
              path.write_text(text)
          ET.parse(path)
          print(f'Valid AndroidManifest.xml: {path.stat().st_size} bytes')
          PY
      - run: flutter pub get
      - name: Build Android debug APK
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: flutter build apk --debug --dart-define=SUPABASE_URL="https://esvljorjykzgrpnrxnma.supabase.co" --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"
      - uses: actions/upload-artifact@v4
        with:
          name: alfaeq-yemen-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
