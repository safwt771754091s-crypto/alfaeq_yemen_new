name: Product Catalog Gallery

# Keeps the public product gallery (catalog/) in sync with the live catalog.
# The gallery is committed to the repository so everyone can see every product
# and exactly which ones still need an image.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max products to include (0 = all)"
        required: false
        default: "0"
  schedule:
    - cron: "0 4 * * *"
  push:
    branches:
      - main
    paths:
      - "tools/build_product_gallery.py"
      - ".github/workflows/product-gallery.yml"

concurrency:
  group: product-gallery
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  gallery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Rebuild the gallery from the live catalog
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: python3 tools/build_product_gallery.py --out catalog --limit "${{ inputs.limit || 0 }}"

      - name: Commit the refreshed gallery
        run: |
          git config user.name "alfaeq-gallery-bot"
          git config user.email "actions@users.noreply.github.com"
          git add catalog/index.html catalog/products.json catalog/missing-images.json
          if git diff --cached --quiet; then
            echo "gallery unchanged"
          else
            git commit -m "chore(catalog): refresh the public product gallery"
            git push
          fi
